[profile.default]
src = "contracts-src"
test = "foundry-test"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 128, depth = 64 }
sparse_mode = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/"
]

[fmt]
line_length = 120
